[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amagi-deadline"
version = "0.1.0"
description = "Compute litigation response deadlines from a trigger event and date, with citations for every rule."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Amagi Solutions Group LLC" }]
keywords = ["legal", "litigation", "deadlines", "cli", "court-rules", "paralegal"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Legal Industry",
    "Topic :: Office/Business",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
amagi-deadline = "amagi_deadline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amagi_deadline = ["data/*.yaml"]
